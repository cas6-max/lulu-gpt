<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu GPT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <h2>Lulu GPT</h2>
    <div id="chat-container">
        <div class="msg bot">> Système initialisé. En attente de commande...</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tape ton message..." autofocus>
        <button onclick="envoyer()" id="send-btn">Envoyer</button>
    </div>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        // Mémoire locale de la discussion pour que l'IA se souvienne de tout
        let memoireGlobale = "Contexte de la discussion : ";

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                envoyer();
            }
        });

        async function envoyer() {
            const texte = inputField.value.trim();
            if (!texte) return;

            const chatContainer = document.getElementById("chat-container");
            
            // Afficher ton message à l'écran
            chatContainer.innerHTML += `<div class="msg user">> Toi : ${texte}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Message d'attente
            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div class="msg bot" id="${loadingId}">> Réflexion en cours...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            sendBtn.disabled = true;

            try {
                // On combine la mémoire des derniers échanges avec ta nouvelle phrase
                memoireGlobale += " Utilisateur: " + texte;

                // On envoie le tout dans l'URL avec un modèle très stable
                const reponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(memoireGlobale)}?model=openai`);
                let data = await reponse.text();

                // Si l'API renvoie le fameux bug {}, on met une réponse de secours sans perdre la mémoire
                if (!data || data.trim() === "{}" || data.trim() === "") {
                    data = "Je suis là ! Continue, je t'écoute.";
                }

                // Afficher la réponse de l'IA
                document.getElementById(loadingId).innerText = `> IA : ${data}`;

                // On ajoute la réponse de l'IA dans la mémoire globale pour qu'elle s'en souvienne au prochain message
                memoireGlobale += " Assistant: " + data;

                // Sécurité : si la mémoire devient trop longue, on garde les 1000 derniers caractères pour ne pas saturer
                if (memoireGlobale.length > 2000) {
                    memoireGlobale = memoireGlobale.slice(-1500);
                }

            } catch (error) {
                document.getElementById(loadingId).innerText = `> Erreur réseau. Réessaie !`;
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            inputField.focus();
        }
    </script>

</body>
</html>
