<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu GPT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <h2>Lulu GPT</h2>
    <div id="chat-container">
        <div class="msg bot">> Système initialisé. En attente de commande...</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tape ton message..." autofocus>
        <button onclick="envoyer()" id="send-btn">Envoyer</button>
    </div>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        
        // On garde un petit historique sous forme de texte simple
        let memoireDiscussion = "Tu es un assistant amical nommé Lulu GPT. ";

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                envoyer();
            }
        });

        async function envoyer() {
            const texte = inputField.value.trim();
            if (!texte) return;

            const chatContainer = document.getElementById("chat-container");
            
            // Afficher ton message
            chatContainer.innerHTML += `<div class="msg user">> Toi : ${texte}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Message d'attente
            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div class="msg bot" id="${loadingId}">> Réflexion en cours...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            sendBtn.disabled = true;

            try {
                // On envoie le contexte et la question directement dans l'URL (zéro bug de format !)
                const promptComplet = memoireDiscussion + " Utilisateur: " + texte;
                const reponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptComplet)}?model=openai`);
                const data = await reponse.text();

                // Afficher la réponse
                document.getElementById(loadingId).innerText = `> IA : ${data}`;
                
                // Mettre à jour la mémoire pour la suite
                memoireDiscussion += " Utilisateur: " + texte + " Assistant: " + data + " ";

                // Sécurité pour pas que la mémoire devienne trop lourde
                if (memoireDiscussion.length > 1500) {
                    memoireDiscussion = memoireDiscussion.slice(-1000);
                }

            } catch (error) {
                document.getElementById(loadingId).innerText = `> Erreur : Le réseau a lâché.`;
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            inputField.focus();
        }
    </script>

</body>
</html>
