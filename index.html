<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lulu GPT</title>

<style>

{ box-sizing: border-box; }
body {

margin: 0;

height: 100vh;

display: flex;

flex-direction: column;

font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

background: #e8eef9;

color: #0f172a;

}



header {

display: flex;

align-items: center;

gap: 12px;

padding: 12px 16px;

background: #ffffff;

border-bottom: 1px solid #dbe3f0;

}

.avatar {

width: 38px; height: 38px;

border-radius: 50%;

background: linear-gradient(135deg, #3b82f6, #1d4ed8);

color: #fff;

display: flex; align-items: center; justify-content: center;

font-weight: 700;

flex-shrink: 0;

}

.title { font-weight: 700; font-size: 1.05rem; }

.status { font-size: .8rem; color: #16a34a; }



#chat {

flex: 1;

overflow-y: auto;

padding: 16px;

display: flex;

flex-direction: column;

gap: 10px;

}



.row { display: flex; align-items: flex-end; gap: 8px; }

.row.user { justify-content: flex-end; }

.row .avatar { width: 30px; height: 30px; font-size: .85rem; }



.bubble {

max-width: 75%;

padding: 10px 14px;

font-size: 1rem;

line-height: 1.45;

white-space: pre-wrap;

word-break: break-word;

}

.row.user .bubble {

background: linear-gradient(135deg, #3b82f6, #1d4ed8);

color: #fff;

border-radius: 18px 18px 4px 18px;

}

.row.bot .bubble {

background: #fff;

color: #0f172a;

border-radius: 18px 18px 18px 4px;

box-shadow: 0 1px 3px rgba(0,0,0,.08);

}

.time {

display: block;

margin-top: 4px;

font-size: .7rem;

opacity: .6;

text-align: right;

}



/* Indicateur "est en train d'écrire" */

.typing { display: flex; gap: 4px; padding: 4px 2px; }

.typing span {

width: 8px; height: 8px;

background: #94a3b8;

border-radius: 50%;

animation: blink 1.2s infinite;

}

.typing span:nth-child(2) { animation-delay: .2s; }

.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }



form {

display: flex;

gap: 10px;

padding: 12px 16px;

background: #fff;

border-top: 1px solid #dbe3f0;

}

input {

flex: 1;

padding: 12px 16px;

font-size: 1rem;

border: 1px solid #cbd5e1;

border-radius: 24px;

outline: none;

font-family: inherit;

}

input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

button {

width: 46px; height: 46px;

border: none;

border-radius: 50%;

background: linear-gradient(135deg, #3b82f6, #1d4ed8);

color: #fff;

font-size: 1.2rem;

cursor: pointer;

}

button:disabled { opacity: .5; cursor: default; }

</style>

</head>

<body>



<header>

<div class="avatar">L</div>

<div>

<div class="title">Lulu GPT</div>

<div class="status">● en ligne</div>

</div>

</header>



<div id="chat"></div>



<form id="form">

<input type="text" id="input" placeholder="Écris un message…" autocomplete="off" autofocus>

<button type="submit" id="send" aria-label="Envoyer">➤</button>

</form>



<script>

const chat = document.getElementById("chat");

const form = document.getElementById("form");

const input = document.getElementById("input");

const sendBtn = document.getElementById("send");



// Historique envoyé à l'IA (la consigne système définit son identité)

const historique = [

{

role: "system",

content: "Tu t'appelles Lulu GPT. Tu es un assistant sympa, tu réponds en français de façon claire et concise. Tu n'es ni ChatGPT ni une IA d'OpenAI."

}

];



function heure() {

return new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

}



// Ajoute une bulle (textContent = pas de risque d'injection HTML)

function ajouterMessage(role, texte) {

const row = document.createElement("div");

row.className = "row " + role;



if (role === "bot") {

const av = document.createElement("div");

av.className = "avatar";

av.textContent = "L";

row.appendChild(av);

}



const bubble = document.createElement("div");

bubble.className = "bubble";

bubble.textContent = texte;



const t = document.createElement("span");

t.className = "time";

t.textContent = heure();

bubble.appendChild(t);



row.appendChild(bubble);

chat.appendChild(row);

chat.scrollTop = chat.scrollHeight;

return row;

}



function ajouterFrappe() {

const row = document.createElement("div");

row.className = "row bot";

row.innerHTML =

'<div class="avatar">L</div>' +

'<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';

chat.appendChild(row);

chat.scrollTop = chat.scrollHeight;

return row;

}



async function demanderIA() {

// On garde le système + les 20 derniers messages

const messages = [historique[0], ...historique.slice(1).slice(-20)];



const res = await fetch("https://text.pollinations.ai/openai", {

method: "POST",

headers: { "Content-Type": "application/json" },

body: JSON.stringify({ model: "openai", messages })

});

if (!res.ok) throw new Error("HTTP " + res.status);

const data = await res.json();

return data.choices?.[0]?.message?.content?.trim() || "Je n'ai pas compris, peux-tu reformuler ?";

}



form.addEventListener("submit", async (e) => {

e.preventDefault();

const texte = input.value.trim();

if (!texte) return;



ajouterMessage("user", texte);

historique.push({ role: "user", content: texte });

input.value = "";

sendBtn.disabled = true;



const frappe = ajouterFrappe();



try {

const reponse = await demanderIA();

frappe.remove();

ajouterMessage("bot", reponse);

historique.push({ role: "assistant", content: reponse });

} catch (err) {

frappe.remove();

ajouterMessage("bot", "Erreur réseau, réessaie dans un instant !");

historique.pop(); // on retire le message qui n'a pas eu de réponse

}



sendBtn.disabled = false;

input.focus();

});



ajouterMessage("bot", "Salut ! Je suis Lulu GPT 👋 Comment puis-je t'aider ?");

</script>



</body>

</html>
