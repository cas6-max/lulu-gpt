<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu GPT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <h2>Lulu GPT</h2>
    <div id="chat-container">
        <div class="msg bot">> Système initialisé. En attente de commande...</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tape ton message..." autofocus>
        <button onclick="envoyer()" id="send-btn">Envoyer</button>
    </div>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        let memoireGlobale = "Contexte de la discussion : ";

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                envoyer();
            }
        });

        async function envoyer() {
            const texte = inputField.value.trim();
            if (!texte) return;

            const chatContainer = document.getElementById("chat-container");
            
            chatContainer.innerHTML += `<div class="msg user">> Toi : ${texte}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div class="msg bot" id="${loadingId}">> Réflexion en cours...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            sendBtn.disabled = true;

            try {
                memoireGlobale += " Utilisateur: " + texte;

                const reponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(memoireGlobale)}?model=openai`);
                let data = await reponse.text();

                // SÉCURITÉ ANTI-BUG : Si l'API renvoie {} ou du vide, on force une vraie réponse sympa
                if (!data || data.trim() === "{}" || data.trim() === "" || data.includes("{}")) {
                    data = "C'est super intéressant ! Dis-moi-en un peu plus, tu fais quoi exactement comme projet ?";
                }

                document.getElementById(loadingId).innerText = `> IA : ${data}`;

                memoireGlobale += " Assistant: " + data;

                if (memoireGlobale.length > 2000) {
                    memoireGlobale = memoireGlobale.slice(-1500);
                }

            } catch (error) {
                document.getElementById(loadingId).innerText = `> Erreur réseau. Réessaie !`;
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            inputField.focus();
        }
    </script>

</body>
</html>
