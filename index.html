<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu GPT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <h2>Lulu GPT</h2>
    <div id="chat-container">
        <div class="msg bot">> Système initialisé. En attente de commande...</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tape ton message..." autofocus>
        <button onclick="envoyer()" id="send-btn">Envoyer</button>
    </div>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                envoyer();
            }
        });

        async function envoyer() {
            const texte = inputField.value.trim();
            if (!texte) return;

            const chatContainer = document.getElementById("chat-container");
            
            // Afficher ton message
            chatContainer.innerHTML += `<div class="msg user">> Toi : ${texte}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Message d'attente
            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div class="msg bot" id="${loadingId}">> Réflexion en cours...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            sendBtn.disabled = true;

            try {
                // On interroge l'API proprement avec ton message direct
                const reponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(texte)}`);
                let data = await reponse.text();

                // Sécurité : si l'API renvoie encore un {} par malheur, on affiche un message propre
                if (!data || data === "{}" || data.trim() === "{}") {
                    data = "Oups, le serveur a toussé. Réessaie une autre question !";
                }

                document.getElementById(loadingId).innerText = `> IA : ${data}`;

            } catch (error) {
                document.getElementById(loadingId).innerText = `> Erreur : Impossible de joindre le serveur.`;
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            inputField.focus();
        }
    </script>

</body>
</html>
