<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Lulu GPT</title>
<meta name="description" content="Lulu GPT, ton assistant IA gratuit : pose tes questions et discute en direct.">
<style>
  * { box-sizing: border-box; }
  html, body { overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e8eef9;
    color: #0f172a;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #dbe3f0;
    flex-shrink: 0;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .title { font-weight: 700; font-size: 1.05rem; }
  .status { font-size: .8rem; color: #16a34a; }

  .icon-btn {
    width: 40px; height: 40px;
    border: 1px solid #dbe3f0;
    border-radius: 12px;
    background: #f1f5f9;
    color: #1e293b;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  #new-chat { margin-left: auto; }

  #chat {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.user { justify-content: flex-end; }
  .row .avatar { width: 30px; height: 30px; font-size: .85rem; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    font-size: 1rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
  }
  .row.bot .bubble {
    background: #fff;
    color: #0f172a;
    border-radius: 18px 18px 18px 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .time {
    display: block;
    margin-top: 4px;
    font-size: .7rem;
    opacity: .6;
    text-align: right;
  }

  /* Indicateur "est en train d'écrire" */
  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 8px; height: 8px;
    background: #94a3b8;
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    background: #fff;
    border-top: 1px solid #dbe3f0;
    flex-shrink: 0;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    font-size: 16px; /* évite le zoom automatique sur iPhone */
    border: 1px solid #cbd5e1;
    border-radius: 24px;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  #send {
    width: 46px; height: 46px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }

  /* --- Panneau des discussions --- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, .45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 10;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }

  #drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(320px, 85vw);
    background: #fff;
    transform: translateX(-100%);
    transition: transform .25s;
    z-index: 11;
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,.15);
  }
  #drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #dbe3f0;
    font-weight: 700;
  }
  #drawer-new {
    margin: 12px 16px 4px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
  }
  .item:hover { background: #f1f5f9; }
  .item.active { background: #e0ebff; }
  .item-text { flex: 1; min-width: 0; }
  .item-title {
    font-size: .95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-date { font-size: .75rem; color: #64748b; margin-top: 2px; }
  .item-del {
    border: none;
    background: transparent;
    font-size: 1rem;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
  }
  .item-del:hover { background: #fee2e2; }
  .vide { padding: 20px 12px; color: #64748b; font-size: .9rem; text-align: center; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menu" type="button" aria-label="Mes discussions">☰</button>
  <div class="avatar">L</div>
  <div>
    <div class="title">Lulu GPT</div>
    <div class="status">● en ligne</div>
  </div>
  <button class="icon-btn" id="new-chat" type="button" aria-label="Nouvelle discussion">＋</button>
</header>

<div id="chat"></div>

<form id="form">
  <input type="text" id="input" placeholder="Écris un message…" autocomplete="off" autofocus>
  <button type="submit" id="send" aria-label="Envoyer">➤</button>
</form>

<div id="overlay"></div>
<aside id="drawer">
  <div class="drawer-head">
    <span>Mes discussions</span>
    <button class="icon-btn" id="close" type="button" aria-label="Fermer">✕</button>
  </div>
  <button id="drawer-new" type="button">＋ Nouvelle discussion</button>
  <div id="list"></div>
</aside>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("overlay");
  const list = document.getElementById("list");

  const SYSTEME = "Tu t'appelles Lulu GPT. Tu es un assistant sympa, tu réponds en français de façon claire et concise. Tu n'es ni ChatGPT ni une IA d'OpenAI.";
  const CLE = "lulugpt_chats_v2";
  const ANCIENNE_CLE = "lulugpt_conversation"; // ancienne version (une seule discussion)
  const BIENVENUE = "Salut ! Je suis Lulu GPT 👋 Comment puis-je t'aider ?";

  // =====================================================
  //  Adresse de ton relais Cloudflare (aucune clé ici)
  // =====================================================
  const WORKER_URL = "COLLE_L_ADRESSE_DU_WORKER_ICI";

  // --- Clavier mobile : la page suit la zone visible, SANS faire défiler le chat ---
  function ajusterHauteur() {
    const vv = window.visualViewport;
    if (vv) {
      document.body.style.height = vv.height + "px";
      document.body.style.top = vv.offsetTop + "px";
    }
  }
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", ajusterHauteur);
    visualViewport.addEventListener("scroll", ajusterHauteur);
  }
  input.addEventListener("focus", () => setTimeout(ajusterHauteur, 300));

  // --- Données : plusieurs discussions sauvegardées sur cet appareil ---
  // chats = [{ id, titre, ts, messages: [{ role, content, ts }] }]
  let chats = [];
  let courant = null;
  let enCours = false;

  function nouveauChat() {
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      titre: "Nouvelle discussion",
      ts: Date.now(),
      messages: []
    };
  }

  function charger() {
    let currentId = null;
    try {
      const brut = localStorage.getItem(CLE);
      if (brut) {
        const data = JSON.parse(brut);
        if (Array.isArray(data.chats)) chats = data.chats;
        currentId = data.current;
      } else {
        // Récupère l'ancienne discussion unique si elle existe
        const ancien = JSON.parse(localStorage.getItem(ANCIENNE_CLE) || "[]");
        if (Array.isArray(ancien) && ancien.length) {
          const c = nouveauChat();
          c.messages = ancien;
          const premier = ancien.find(m => m.role === "user");
          c.titre = premier ? titreDepuis(premier.content) : "Ancienne discussion";
          c.ts = ancien[ancien.length - 1].ts || Date.now();
          chats = [c];
        }
      }
    } catch (e) {
      chats = [];
    }
    courant = chats.find(c => c.id === currentId) || nouveauChat();
  }

  function sauvegarder() {
    try {
      if (courant.messages.length && !chats.includes(courant)) chats.push(courant);
      chats.forEach(c => { c.messages = c.messages.slice(-100); });
      chats.sort((a, b) => a.ts - b.ts);
      chats = chats.slice(-50); // on garde les 50 dernières discussions
      localStorage.setItem(CLE, JSON.stringify({ chats, current: courant.id }));
    } catch (e) {
      // navigation privée ou stockage plein : on continue sans sauvegarder
    }
  }

  function titreDepuis(texte) {
    const t = texte.replace(/\s+/g, " ").trim();
    return t.length > 40 ? t.slice(0, 40) + "…" : t;
  }

  function heure(ts) {
    return new Date(ts || Date.now()).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function dateCourte(ts) {
    const d = new Date(ts);
    const auj = new Date();
    if (d.toDateString() === auj.toDateString()) return "Aujourd'hui, " + heure(ts);
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + ", " + heure(ts);
  }

  // --- Affichage des messages ---
  // defilement : "bas" (fin du chat) ou "debut" (début de ce message)
  function ajouterMessage(role, texte, defilement = "bas", ts) {
    const row = document.createElement("div");
    row.className = "row " + role;

    if (role === "bot") {
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = "L";
      row.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = texte;

    const t = document.createElement("span");
    t.className = "time";
    t.textContent = heure(ts);
    bubble.appendChild(t);

    row.appendChild(bubble);
    chat.appendChild(row);

    if (defilement === "debut") {
      chat.scrollTop = Math.max(0, row.offsetTop - 12);
    } else {
      chat.scrollTop = chat.scrollHeight;
    }
    return row;
  }

  function ajouterFrappe() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML =
      '<div class="avatar">L</div>' +
      '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function afficherConversation() {
    chat.innerHTML = "";
    ajouterMessage("bot", BIENVENUE);
    courant.messages.forEach(m => {
      ajouterMessage(m.role === "user" ? "user" : "bot", m.content, "bas", m.ts);
    });
    chat.scrollTop = chat.scrollHeight;
  }

  // --- Panneau des discussions ---
  function ouvrirPanneau() {
    afficherListe();
    drawer.classList.add("open");
    overlay.classList.add("open");
  }
  function fermerPanneau() {
    drawer.classList.remove("open");
    overlay.classList.remove("open");
  }

  function afficherListe() {
    list.innerHTML = "";
    const triees = [...chats].sort((a, b) => b.ts - a.ts);

    if (!triees.length) {
      const v = document.createElement("div");
      v.className = "vide";
      v.textContent = "Aucune discussion pour l'instant.";
      list.appendChild(v);
      return;
    }

    triees.forEach(c => {
      const item = document.createElement("div");
      item.className = "item" + (c.id === courant.id ? " active" : "");

      const texte = document.createElement("div");
      texte.className = "item-text";
      const titre = document.createElement("div");
      titre.className = "item-title";
      titre.textContent = c.titre;
      const date = document.createElement("div");
      date.className = "item-date";
      date.textContent = dateCourte(c.ts);
      texte.appendChild(titre);
      texte.appendChild(date);

      const del = document.createElement("button");
      del.className = "item-del";
      del.type = "button";
      del.textContent = "🗑";
      del.setAttribute("aria-label", "Supprimer cette discussion");
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        supprimerChat(c.id);
      });

      item.appendChild(texte);
      item.appendChild(del);
      item.addEventListener("click", () => ouvrirChat(c.id));
      list.appendChild(item);
    });
  }

  function ouvrirChat(id) {
    const c = chats.find(x => x.id === id);
    if (!c) return;
    courant = c;
    sauvegarder();
    afficherConversation();
    fermerPanneau();
  }

  function creerNouveauChat() {
    // Si la discussion actuelle est déjà vide, inutile d'en créer une autre
    if (!courant.messages.length) { fermerPanneau(); input.focus(); return; }
    courant = nouveauChat();
    sauvegarder();
    afficherConversation();
    fermerPanneau();
    input.focus();
  }

  function supprimerChat(id) {
    if (!confirm("Supprimer cette discussion ?")) return;
    chats = chats.filter(c => c.id !== id);
    if (courant.id === id) {
      courant = nouveauChat();
      afficherConversation();
    }
    sauvegarder();
    afficherListe();
  }

  document.getElementById("menu").addEventListener("click", ouvrirPanneau);
  document.getElementById("close").addEventListener("click", fermerPanneau);
  overlay.addEventListener("click", fermerPanneau);
  document.getElementById("new-chat").addEventListener("click", creerNouveauChat);
  document.getElementById("drawer-new").addEventListener("click", creerNouveauChat);

  // --- IA : Gemini via ton relais en premier, Pollinations en secours ---
  async function appelerRelais(messagesConversation) {
    const ctrl = new AbortController();
    const minuteur = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: messagesConversation }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data.text) throw new Error("réponse vide");
      return data.text;
    } finally {
      clearTimeout(minuteur);
    }
  }

  async function appelerPollinations(model, messages) {
    const ctrl = new AbortController();
    const minuteur = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, messages }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const texte = data.choices?.[0]?.message?.content?.trim();
      if (!texte) throw new Error("réponse vide");
      return texte;
    } finally {
      clearTimeout(minuteur);
    }
  }

  async function demanderIA(discussion) {
    const recents = discussion.messages
      .slice(-20)
      .map(m => ({ role: m.role, content: m.content }));

    // 1) Gemini, via ton relais (la clé reste cachée côté relais)
    if (WORKER_URL.startsWith("http")) {
      try {
        return await appelerRelais(recents);
      } catch (e) {
        console.warn("Relais Gemini indisponible :", e.message); // limite atteinte, panne…
      }
    }

    // 2) Secours gratuit sans clé
    const avecSysteme = [{ role: "system", content: SYSTEME }, ...recents];
    for (const model of ["openai", "mistral", "llama"]) {
      try {
        return await appelerPollinations(model, avecSysteme);
      } catch (e) {
        console.warn("Pollinations indisponible :", model, e.message);
      }
    }
    throw new Error("Aucune IA n'a répondu");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texte = input.value.trim();
    if (!texte || enCours) return;

    const discussion = courant; // on garde la discussion d'origine
    const ts = Date.now();

    if (!discussion.messages.length) discussion.titre = titreDepuis(texte);
    discussion.messages.push({ role: "user", content: texte, ts });
    discussion.ts = ts;
    sauvegarder();
    ajouterMessage("user", texte, "bas", ts);

    input.value = "";
    enCours = true;
    sendBtn.disabled = true;
    const frappe = ajouterFrappe();

    try {
      const reponse = await demanderIA(discussion);
      frappe.remove();
      const tsRep = Date.now();
      discussion.messages.push({ role: "assistant", content: reponse, ts: tsRep });
      discussion.ts = tsRep;
      sauvegarder();
      // On n'affiche la réponse que si on est toujours dans cette discussion
      if (courant === discussion) ajouterMessage("bot", reponse, "debut", tsRep);
    } catch (err) {
      frappe.remove();
      discussion.messages.pop(); // on retire le message qui n'a pas eu de réponse
      sauvegarder();
      if (courant === discussion) ajouterMessage("bot", "Erreur réseau, réessaie dans un instant !");
    }

    enCours = false;
    sendBtn.disabled = false;
    input.focus();
  });

  // Démarrage
  charger();
  afficherConversation();
  ajusterHauteur();
</script>

</body>
</html>
