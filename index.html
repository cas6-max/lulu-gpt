<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Lulu GPT</title>
<meta name="description" content="Lulu GPT, ton assistant IA gratuit : pose tes questions et discute en direct.">
<style>
  * { box-sizing: border-box; }
  html, body { overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e8eef9;
    color: #0f172a;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #dbe3f0;
    flex-shrink: 0;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .title { font-weight: 700; font-size: 1.05rem; }
  .status { font-size: .8rem; color: #16a34a; }

  #clear {
    margin-left: auto;
    padding: 8px 12px;
    font-size: .85rem;
    font-family: inherit;
    color: #475569;
    background: #f1f5f9;
    border: 1px solid #dbe3f0;
    border-radius: 16px;
    cursor: pointer;
  }

  #chat {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.user { justify-content: flex-end; }
  .row .avatar { width: 30px; height: 30px; font-size: .85rem; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    font-size: 1rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
  }
  .row.bot .bubble {
    background: #fff;
    color: #0f172a;
    border-radius: 18px 18px 18px 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .time {
    display: block;
    margin-top: 4px;
    font-size: .7rem;
    opacity: .6;
    text-align: right;
  }

  /* Indicateur "est en train d'écrire" */
  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 8px; height: 8px;
    background: #94a3b8;
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    background: #fff;
    border-top: 1px solid #dbe3f0;
    flex-shrink: 0;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    font-size: 16px; /* évite le zoom automatique sur iPhone */
    border: 1px solid #cbd5e1;
    border-radius: 24px;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  #send {
    width: 46px; height: 46px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="avatar">L</div>
  <div>
    <div class="title">Lulu GPT</div>
    <div class="status">● en ligne</div>
  </div>
  <button id="clear" type="button">🗑 Effacer</button>
</header>

<div id="chat"></div>

<form id="form">
  <input type="text" id="input" placeholder="Écris un message…" autocomplete="off" autofocus>
  <button type="submit" id="send" aria-label="Envoyer">➤</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");

  const SYSTEME = "Tu t'appelles Lulu GPT. Tu es un assistant sympa, tu réponds en français de façon claire et concise. Tu n'es ni ChatGPT ni une IA d'OpenAI.";
  const CLE = "lulugpt_conversation";
  const BIENVENUE = "Salut ! Je suis Lulu GPT 👋 Comment puis-je t'aider ?";

  // --- Clavier mobile : la page suit la zone visible, SANS faire défiler le chat ---
  function ajusterHauteur() {
    const vv = window.visualViewport;
    if (vv) {
      document.body.style.height = vv.height + "px";
      document.body.style.top = vv.offsetTop + "px";
    }
  }
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", ajusterHauteur);
    visualViewport.addEventListener("scroll", ajusterHauteur);
  }
  input.addEventListener("focus", () => setTimeout(ajusterHauteur, 300));

  // --- Sauvegarde dans le navigateur de chaque visiteur ---
  // conversation = [{ role: "user" | "assistant", content: "...", ts: 1234567890 }]
  let conversation = [];

  function charger() {
    try {
      const brut = localStorage.getItem(CLE);
      const data = brut ? JSON.parse(brut) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function sauvegarder() {
    try {
      conversation = conversation.slice(-100); // on garde les 100 derniers messages
      localStorage.setItem(CLE, JSON.stringify(conversation));
    } catch (e) {
      // navigation privée ou stockage plein : on continue sans sauvegarder
    }
  }

  function heure(ts) {
    return new Date(ts || Date.now()).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  // defilement : "bas" (fin du chat) ou "debut" (début de ce message)
  function ajouterMessage(role, texte, defilement = "bas", ts) {
    const row = document.createElement("div");
    row.className = "row " + role;

    if (role === "bot") {
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = "L";
      row.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = texte;

    const t = document.createElement("span");
    t.className = "time";
    t.textContent = heure(ts);
    bubble.appendChild(t);

    row.appendChild(bubble);
    chat.appendChild(row);

    if (defilement === "debut") {
      chat.scrollTop = Math.max(0, row.offsetTop - 12);
    } else {
      chat.scrollTop = chat.scrollHeight;
    }
    return row;
  }

  function ajouterFrappe() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML =
      '<div class="avatar">L</div>' +
      '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  // Affiche le message d'accueil puis tout l'historique sauvegardé
  function afficherConversation() {
    chat.innerHTML = "";
    ajouterMessage("bot", BIENVENUE);
    conversation.forEach(m => {
      ajouterMessage(m.role === "user" ? "user" : "bot", m.content, "bas", m.ts);
    });
    chat.scrollTop = chat.scrollHeight;
  }

  async function demanderIA() {
    // Consigne système + les 20 derniers messages
    const messages = [
      { role: "system", content: SYSTEME },
      ...conversation.slice(-20).map(m => ({ role: m.role, content: m.content }))
    ];

    const res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "openai", messages })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || "Je n'ai pas compris, peux-tu reformuler ?";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texte = input.value.trim();
    if (!texte) return;

    const ts = Date.now();
    ajouterMessage("user", texte, "bas", ts);
    conversation.push({ role: "user", content: texte, ts });
    sauvegarder();
    input.value = "";
    sendBtn.disabled = true;

    const frappe = ajouterFrappe();

    try {
      const reponse = await demanderIA();
      frappe.remove();
      const tsRep = Date.now();
      // La réponse s'affiche depuis son début, pas depuis sa fin
      ajouterMessage("bot", reponse, "debut", tsRep);
      conversation.push({ role: "assistant", content: reponse, ts: tsRep });
      sauvegarder();
    } catch (err) {
      frappe.remove();
      ajouterMessage("bot", "Erreur réseau, réessaie dans un instant !");
      conversation.pop(); // on retire le message qui n'a pas eu de réponse
      sauvegarder();
    }

    sendBtn.disabled = false;
    input.focus();
  });

  clearBtn.addEventListener("click", () => {
    if (!confirm("Effacer toute la discussion ?")) return;
    conversation = [];
    sauvegarder();
    afficherConversation();
  });

  // Démarrage : on recharge la discussion de cette personne
  conversation = charger();
  afficherConversation();
  ajusterHauteur();
</script>

</body>
</html>
