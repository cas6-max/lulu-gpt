<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu GPT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <h2>Lulu GPT</h2>
    <div id="chat-container">
        <div class="msg bot">> Système initialisé. En attente de commande...</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tape ton message..." autofocus>
        <button onclick="envoyer()" id="send-btn">Envoyer</button>
    </div>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        
        // Historique de conversation léger (on garde une base simple)
        let historiqueChat = [
            { role: "system", content: "Tu es un assistant virtuel concis et rapide." }
        ];

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                envoyer();
            }
        });

        async function envoyer() {
            const texte = inputField.value.trim();
            if (!texte) return;

            const chatContainer = document.getElementById("chat-container");
            
            // Afficher ton message
            chatContainer.innerHTML += `<div class="msg user">> Toi : ${texte}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Ajouter à l'historique
            historiqueChat.push({ role: "user", content: texte });

            // SECURITÉ FLUIDITÉ : Si l'historique dépasse 7 messages, on efface les plus anciens 
            // pour que l'IA ne ralentisse jamais.
            if (historiqueChat.length > 7) {
                // On garde la consigne système (index 0) et les 6 derniers messages
                historiqueChat = [historiqueChat[0], ...historiqueChat.slice(-6)];
            }

            // Message d'attente
            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div class="msg bot" id="${loadingId}">> Réflexion en cours...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Désactiver le bouton pendant qu'elle réfléchit pour éviter les doubles clics bloquants
            sendBtn.disabled = true;

            try {
                // Appel ultra-rapide à l'API avec un format allégé
                const reponse = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: historiqueChat,
                        model: 'openai'
                    })
                });
                
                const data = await reponse.text();

                document.getElementById(loadingId).innerText = `> IA : ${data}`;
                historiqueChat.push({ role: "assistant", content: data });

            } catch (error) {
                document.getElementById(loadingId).innerText = `> Erreur : Le serveur a mis trop de temps à répondre. Réessaie !`;
            }

            // Réactiver le bouton
            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            inputField.focus();
        }
    </script>

</body>
</html>
