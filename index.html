<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu GPT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <h2>Lulu GPT</h2>
    <div id="chat-container">
        <div class="msg bot">> Système initialisé. En attente de commande...</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Tape ton message..." autofocus>
        <button onclick="envoyer()" id="send-btn">Envoyer</button>
    </div>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                envoyer();
            }
        });

        async function envoyer() {
            const texte = inputField.value.trim();
            if (!texte) return;

            const chatContainer = document.getElementById("chat-container");
            
            // Afficher ton message
            chatContainer.innerHTML += `<div class="msg user">> Toi : ${texte}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Message d'attente
            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div class="msg bot" id="${loadingId}">> Réflexion en cours...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            sendBtn.disabled = true;

            try {
                // On utilise une autre route alternative de Pollinations dédiée aux objets JSON propres
                const reponse = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: texte }],
                        model: "openai",
                        json: false
                    } )
                });

                let data = await reponse.text();

                // Si jamais il y a encore un {} ou que c'est vide, on met un message de secours
                if (!data || data.includes("{}") || data.trim() === "") {
                    data = "Salut ! Je suis en ligne. Dis-moi, qu'est-ce qu'on fait ?";
                }

                document.getElementById(loadingId).innerText = `> IA : ${data}`;

            } catch (error) {
                document.getElementById(loadingId).innerText = `> Erreur réseau. Réessaie dans une seconde.`;
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            inputField.focus();
        }
    </script>

</body>
</html>
